name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # 与实际运行环境一致（Windows 桌面端 + Node 22），路径与换行问题能在这里暴露。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build desktop renderer
        run: npm run desktop:build
      - name: Desktop E2E
        run: npm run test:e2e
      - name: Upload desktop E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: test-results/desktop-e2e
          if-no-files-found: warn
